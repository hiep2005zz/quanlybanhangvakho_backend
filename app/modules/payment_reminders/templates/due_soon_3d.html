<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif">
    <main style="max-width:600px;margin:0 auto;padding:24px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px">
      <h1 style="font-size:20px">Hóa đơn sắp đến hạn thanh toán</h1>
      <p>{{message}}</p>
      <p><strong>Mã hóa đơn:</strong> {{invoice_code}}</p>
      <p><strong>Hạn thanh toán:</strong> {{due_date}}</p>
      <p><strong>Số tiền còn nợ:</strong> {{remaining_debt}}</p>
      <p><a href="{{payment_url}}" style="color:#1d4ed8">Xem hóa đơn và công nợ</a></p>
    </main>
  </body>
</html>
